<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플리의 평범한 하루 속 덕질 성향 테스트</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.95);       
            --text-main: #2d3142;
            --text-sub: #7a828e;
            --accent-pink: #ff758c;   
            --accent-purple: #9b5de5;
            --accent-glow: rgba(155, 93, 229, 0.3);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #f0e6ff, #e8f4f8);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 36px;
            box-shadow: 0 20px 50px rgba(155, 93, 229, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 4px solid #ffffff;
            position: relative;
            z-index: 10;
        }

        .phone-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8c93a0;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .hide {
            display: none !important;
        }

        .time-badge {
            font-size: 11.5px;
            background: rgba(255, 117, 140, 0.12);
            color: var(--accent-pink);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        #start-screen h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-main);
            line-height: 1.4;
        }
        #start-screen h1 span {
            color: var(--accent-purple);
        }
        #start-screen p {
            font-size: 13.5px;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .phone-widget-box {
            background: #f8f9fc;
            border: 1.5px solid #edf2f7;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #555c6d;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .widget-icon {
            font-size: 22px;
        }

        .progress-bar {
            background: #f0f2f5;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-step {
            font-size: 11px;
            color: var(--accent-purple);
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        #question-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 22px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            color: var(--text-main);
        }

        .choice-btn {
            background: #f8f9fc;
            border: 1.5px solid #e2e8f0;
            color: var(--text-main);
            padding: 13px 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            line-height: 1.4;
        }
        .choice-btn:hover {
            border-color: var(--accent-purple);
            background: rgba(155, 93, 229, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        #loading-screen {
            padding: 40px 0;
        }
        .spinner {
            width: 45px;
            height: 45px;
            margin: 0 auto 15px auto;
            border: 4px solid rgba(155, 93, 229, 0.1);
            border-top: 4px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--accent-purple);
            font-size: 13px;
            font-weight: bold;
        }

        .result-box h3 {
            font-size: 11px;
            color: var(--accent-purple);
            margin: 0 0 6px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .result-box h2 {
            font-size: 18px;
            color: var(--text-main);
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        .result-badge {
            font-size: 11.5px;
            background: rgba(155, 93, 229, 0.1);
            color: var(--accent-purple);
            border: 1px solid rgba(155, 93, 229, 0.25);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .result-desc {
            font-size: 13px;
            line-height: 1.6;
            color: #4a5568;
            text-align: left;
            background: #f8f9fc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-pink);
            white-space: pre-line;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-size: 14.5px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(155, 93, 229, 0.3);
            transition: all 0.3s ease;
        }
        .main-btn:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- 스마트폰 상태바 -->
        <div class="phone-status-bar">
            <span>08:30</span>
            <span>📶 🔋 100%</span>
        </div>

        <!-- 시작 화면 -->
        <div id="start-screen">
            <div class="time-badge">🌅 AM 08:30 | 아침 알람 울림</div>
            <h1>어느 <span>플리</span>의 폰 화면 속<br>덕질 성향 테스트</h1>
            <p>눈을 뜨자마자 비몽사몽 폰을 켜서 확인하는 첫 화면! 당신의 리얼한 덕질 일상을 확인해봐 ✨</p>
            
            <div class="phone-widget-box">
                <div class="widget-icon">💌</div>
                <div>
                    <div style="font-weight: bold; font-size: 12px; color: #ff758c; margin-bottom: 2px;">새로운 알람 1개</div>
                    <div>(부스스...) "어우, 자는 동안 스밍 리스트 안 끊겼겠지...?"</div>
                </div>
            </div>

            <!-- HTML 태그에 직접 onclick 함수 명시 -->
            <button class="main-btn" onclick="startTest()">화면 켜고 테스트 시작하기 ✨</button>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hide">
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="question-step" id="question-step-num">QUESTION 01</div>
            <div id="question-text">질문 내용</div>
            <div id="choices-container"></div>
        </div>

        <!-- 로딩 화면 -->
        <div id="loading-screen" class="hide">
            <div class="spinner"></div>
            <p class="loading-text">플리의 하루 일과를 분석하는 중... 🪄</p>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hide">
            <div class="result-box">
                <div class="time-badge" style="background: rgba(255, 117, 140, 0.15); color: #d94e71;">🌙 PM 11:00 | 하루의 끝, 덕질 결산</div>
                <h3>✨ 나의 플리 일상 유형 ✨</h3>
                <h2 id="result-title">결과 타이틀</h2>
                <div class="result-badge" id="result-badge">특성 태그</div>
                <div class="result-desc" id="result-desc">결과 설명</div>
            </div>
            <button class="main-btn" onclick="restartTest()">내 하루 다시 확인하기 릴레이~ 💜</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                step: "🌅 AM 08:30 - 기기의 아침",

                    { text: "은호픽! 짜장면~ 콤보로 고구마튀김까지 군침 흘리기", type: "chill" },

            {
                step: "🌆 PM 06:30 - 퇴근 및 하교 길",

                choices: [
                    { text: "음총팀 리스트 확인하면서 빠트린 거 없는지 체크! <추천!", type: "stream" },
                    { text: "내 (다)계정 스밍이 잘 돌아가고 있나 슴췍슴췍~ 눈치 게임.", type: "stream" },
                    { text: "투표 이제 본격적으로 할 거야!! 다들 날 말리지마!!", type: "vote" },
                    { text: "헉, 공계에서 또 무슨 떡밥이 떴지?!! 트위터 새로고침 무한.", type: "news" }
                ]
            },
            {
                step: "🌙 PM 09:00 - 심쿵 밤타임",
                question: "띠링! 갑작스레 켜진 위버스 라이브 알람!",
                choices: [
                    { text: "당장 이어폰 장착! 알람 울리자마자 0.1초 만에 입장!", type: "news" },
                    { text: "이어폰.... 없어.... 위버스 소리만 끄고... 자막 보며 힐링하기....", type: "chill" },
                    { text: "편한 장소에서 맛있는 야식까지 준비 완! 위버라와 함께 맛저~", type: "news" },
                    { text: "쿨쿨... 잠자느라 못 봤어 ㅠㅠㅠ 왜 나는 항상 놓칠까 ㅠㅠㅠ", type: "vote" }
                ]
            },
            {
                step: "🌌 PM 11:30 - 하루를 마무리하며",
                question: "잠들기 전 침대에 누워 마지막으로 하는 생각은?",
                choices: [
                    { text: "오늘 총 스밍 시간 몇 시간 찍었지? 내일 목표치 설정하기.", type: "stream" },
                    { text: "내일 투표 일정 알람 맞춰두고 잠들기 전 스퍼트!", type: "vote" },
                    { text: "오늘 라이브 복습하면서 덕메들이랑 주접 톡 나누기", type: "news" },
                    { text: "오늘도 플레이브 덕분에 행복했다... 스르륵 취침", type: "chill" }
                ]
            }
        ];

        const results = [
            {
                type: "stream",
                title: "🎵 [철저한 데이터 관리자] 음총팀 특채 인재형",
                badge: "#음총의신 #기계적파괴자 #스밍장인",
                desc: "당신은 플레이브의 음원 성적을 철저하게 책임지는 든든한 데이터 분석가 플리!\n\n눈 뜨자마자 스밍 상태를 점검하고, 일상 속에서도 슴췍이 생활화되어 있는 프로 덕후입니다. 플레이브가 음방 1위를 찍는 그날까지 당신의 플레이리스트는 단 1초도 쉬지 않아요. 플리의 영원한 든든한 버팀목!"
            },
            {
                type: "vote",
                title: "🏆 [투표는 나의 삶] 영혼의 1위 메이커형",
                badge: "#투표머신 #우리애들1위는내가 #열정만렙",
                desc: "하트와 투표권은 가득 쌓여있을 때 가장 마음이 편안해지는 타입!\n\n각종 앱을 돌며 투표하는 것이 하루 일과의 핵심이며, '우리 애들 1위 만들어주기'에 진심인 열정 만렙 플리입니다. 투표 독려 글을 보면 지나치지 못하고 손이 먼저 반응하는 행동파 덕후예요."
            },
            {
                type: "news",
                title: "📢 [실시간 앓이 중] 24시간 라방 대기조형",
                badge: "#위버라산증인 #실시간주접러 #소통왕",
                desc: "공계 알림 소리만 울려도 심장이 쿵 내려앉는 과몰입 만렙 플리!\n\n위버스 라이브가 켜지면 언제 어디서든 달려갈 준비가 되어 있으며, 멤버들의 사소한 말 한마디와 떡밥을 물고 덕메들과 밤새 수다 떨 수 있는 천생 소통왕입니다. 멤버들의 웃음 버튼이자 다정한 응원러예요."

            {
                type: "chill",
                title: "🌿 [힐링 지향 플리] 뉴비 같은 고인물형",
                badge: "#청량힐링 #덕질은즐겁게 #얼굴이복지",
                desc: "플레이브의 음악과 청량한 비주얼 그 자체를 온전히 사랑하는 힐링 플리!\n\n스트레스받지 않고 나만의 속도로 즐겁게 덕질하며, 멤버들의 라이브와 예능을 보며 소소한 행복을 찾는 평화주의자입니다. 보고만 있어도 미소가 지어지는 청정 그 자체의 덕질 스타일이에요."

        let currentQuestionIndex = 0;
        let userScores = { stream: 0, vote: 0, news: 0, chill: 0 };

        function startTest() {
            const startScreen = document.getElementById("start-screen");
            const quizScreen = document.getElementById("quiz-screen
