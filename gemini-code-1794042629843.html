<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플리의 평범한 하루 속 덕질 성향 테스트</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.95);       
            --text-main: #2d3142;
            --text-sub: #7a828e;
            --accent-pink: #ff758c;   
            --accent-purple: #9b5de5;
            --accent-glow: rgba(155, 93, 229, 0.3);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background: linear-gradient(135deg, #ffe5ec, #f0e6ff, #e8f4f8);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .container {
            background: var(--card-bg);
            padding: 35px 25px;
            border-radius: 36px;
            box-shadow: 0 20px 50px rgba(155, 93, 229, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 4px solid #ffffff;
            position: relative;
            z-index: 10;
        }

        .phone-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8c93a0;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .hide {
            display: none !important;
        }

        .time-badge {
            font-size: 11.5px;
            background: rgba(255, 117, 140, 0.12);
            color: var(--accent-pink);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        #start-screen h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--text-main);
            line-height: 1.4;
        }
        #start-screen h1 span {
            color: var(--accent-purple);
        }
        #start-screen p {
            font-size: 13.5px;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .phone-widget-box {
            background: #f8f9fc;
            border: 1.5px solid #edf2f7;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #555c6d;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .widget-icon {
            font-size: 22px;
        }

        .progress-bar {
            background: #f0f2f5;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-step {
            font-size: 11px;
            color: var(--accent-purple);
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        #question-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 22px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            color: var(--text-main);
        }

        .choice-btn {
            background: #f8f9fc;
            border: 1.5px solid #e2e8f0;
            color: var(--text-main);
            padding: 13px 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            line-height: 1.4;
        }
        .choice-btn:hover {
            border-color: var(--accent-purple);
            background: rgba(155, 93, 229, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        #loading-screen {
            padding: 40px 0;
        }
        .spinner {
            width: 45px;
            height: 45px;
            margin: 0 auto 15px auto;
            border: 4px solid rgba(155, 93, 229, 0.1);
            border-top: 4px solid var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: var(--accent-purple);
            font-size: 13px;
            font-weight: bold;
        }

        .result-box h3 {
            font-size: 11px;
            color: var(--accent-purple);
            margin: 0 0 6px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .result-box h2 {
            font-size: 18px;
            color: var(--text-main);
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        .result-badge {
            font-size: 11.5px;
            background: rgba(155, 93, 229, 0.1);
            color: var(--accent-purple);
            border: 1px solid rgba(155, 93, 229, 0.25);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .result-desc {
            font-size: 13px;
            line-height: 1.6;
            color: #4a5568;
            text-align: left;
            background: #f8f9fc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-pink);
            white-space: pre-line;
        }

        .main-btn {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-size: 14.5px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(155, 93, 229, 0.3);
            transition: all 0.3s ease;
        }
        .main-btn:hover {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- 스마트폰 상태바 -->
        <div class="phone-status-bar">
            <span>08:30</span>
            <span>📶 🔋 100%</span>
        </div>

        <!-- 시작 화면 -->
        <div id="start-screen">
            <div class="time-badge">🌅 AM 08:30 | 아침 알람 울림</div>
            <h1>어느 <span>플리</span>의 폰 화면 속<br>덕질 성향 테스트</h1>
            <p>눈을 뜨자마자 비몽사몽 폰을 켜서 확인하는 첫 화면! 당신의 리얼한 덕질 일상을 확인해봐 ✨</p>
            
            <div class="phone-widget-box">
                <div class="widget-icon">💌</div>
                <div>
                    <div style="font-weight: bold; font-size: 12px; color: #ff758c; margin-bottom: 2px;">새로운 알람 1개</div>
                    <div>(부스스...) "어우, 자는 동안 스밍 리스트 안 끊겼겠지...?"</div>
                </div>
            </div>

            <button id="start-btn" class="main-btn">화면 켜고 테스트 시작하기 ✨</button>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-screen" class="hide">
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="question-step" id="question-step-num">QUESTION 01</div>
            <div id="question-text">질문 내용</div>
            <div id="choices-container"></div>
        </div>

        <!-- 로딩 화면 -->
        <div id="loading-screen" class="hide">
            <div class="spinner"></div>
            <p class="loading-text">플리의 하루 일과를 분석하는 중... 🪄</p>
        </div>

        <!-- 결과 화면 -->
        <div id="result-screen" class="hide">
            <div class="result-box">
                <div class="time-badge" style="background: rgba(255, 117, 140, 0.15); color: #d94e71;">🌙 PM 11:00 | 하루의 끝, 덕질 결산</div>
                <h3>✨ 나의 플리 일상 유형 ✨</h3>
                <h2 id="result-title">결과 타이틀</h2>
                <div class="result-badge" id="result-badge">특성 태그</div>
                <div class="result-desc" id="result-desc">결과 설명</div>
            </div>
            <button id="restart-btn" class="main-btn">내 하루 다시 확인하기 릴레이~ 💜</button>
        </div>
    </div>

                question: "자고 일어나서 눈 비비며 폰을 켜고 가장 먼저 확인하는 건?",
                choices: [
                    { text: "스밍이 끊겼나?! 악, 기계적이 떴잖아!", type: "stream" },
                    { text: "투표~ 투표~ 투표~ 우리 플레이브 1위 만들어주자~", type: "vote" },
                    { text: "최신 소식 업데이트! 휴, 내가 자는 사이 새로운 소식이 올라오진 않았군
