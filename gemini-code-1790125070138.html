<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타로와 별의 기록 : 오늘의 별자리와 여성향 운명</title>
    <style>
        :root {
            --bg-deep: #0b0f19;       /* 깊은 밤하늘 남색 */
            --card-bg: #131b2e;       /* 카드 및 컨테이너 배경 */
            --gold-accent: #d4af37;   /* 신비로운 골드 */
            --gold-glow: rgba(212, 175, 55, 0.3);
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(rgba(212, 175, 55, 0.2) 2px, transparent 2px);
            background-size: 50px 50px, 100px 100px;
            background-position: 0 0, 25px 25px;
        }

        /* 배경 타로 카드 연출 */
        .floating-cards {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .tarot-deco {
            position: absolute;
            width: 70px;
            height: 110px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            background: rgba(19, 27, 46, 0.6);
            animation: float 8s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .tarot-deco:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; transform: rotate(-15deg); }
        .tarot-deco:nth-child(2) { top: 70%; left: 15%; animation-delay: 3s; transform: rotate(20deg); }
        .tarot-deco:nth-child(3) { top: 15%; right: 12%; animation-delay: 1.5s; transform: rotate(10deg); }
        .tarot-deco:nth-child(4) { top: 65%; right: 10%; animation-delay: 4s; transform: rotate(-25deg); }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-15px) rotate(var(--rot, 0deg)); }
        }

        .container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 440px; /* 기본 입력창 너비 */
            text-align: center;
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            position: relative;
            z-index: 10;
            transition: max-width 0.4s ease;
        }

        /* 결과 화면 진입 시 컨테이너를 넓혀서 2분할 수용 */
        .container.wide-result {
            max-width: 860px;
        }

        .hide {
            display: none !important;
        }

        #input-screen h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--gold-accent);
            line-height: 1.4;
            letter-spacing: 0.5px;
        }
        #input-screen p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: var(--gold-accent);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            background: #0b0f19;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .gender-group {
            display: flex;
            gap: 10px;
        }
        .gender-btn {
            flex: 1;
            padding: 12px;
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            background: #0b0f19;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .gender-btn.active {
            border-color: var(--gold-accent);
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-accent);
            font-weight: bold;
            box-shadow: 0 0 8px var(--gold-glow);
        }

        #loading-screen {
            padding: 40px 0;
        }
        .crystal-ball {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #8a2be2, #0b0f19);
            box-shadow: 0 0 30px #8a2be2, inset 0 0 20px rgba(255,255,255,0.5);
            animation: pulse-ball 1.5s infinite alternate;
        }
        @keyframes pulse-ball {
            0% { transform: scale(0.95); box-shadow: 0 0 20px #8a2be2; }
            100% { transform: scale(1.05); box-shadow: 0 0 40px #d4af37, 0 0 20px #8a2be2; }
        }
        .loading-text {
            color: var(--gold-accent);
            font-size: 14px;
            letter-spacing: 1px;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* --- 결과 화면 2분할 레이아웃 스타일 --- */
        .result-split-wrapper {
            display: flex;
            gap: 20px;
            text-align: left;
            margin-bottom: 25px;
        }
        .result-col {
            flex: 1;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .result-col h3 {
            font-size: 11px;
            color: var(--gold-accent);
            margin: 0 0 8px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .result-col h2 {
            font-size: 18px;
            color: var(--text-main);
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        .result-badge {
            font-size: 11.5px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-accent);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .result-desc-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 15px;
        }
        .why-recommended-box {
            background: rgba(212, 175, 55, 0.05);
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
            padding-top: 12px;
            margin-top: auto;
        }
        .why-recommended-box p {
            margin: 0;
            font-size: 12.5px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .why-recommended-box span {
            color: var(--gold-accent);
            font-weight: bold;
        }

        /* 오른쪽 운세 컬럼 내부 상세 */
        .astrology-summary-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 15px;
        }
        .astro-items-box {
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            margin-top: auto;
        }
        .astro-items-box p {
            margin: 6px 0;
            font-size: 12.5px;
            color: #cbd5e1;
        }
        .astro-items-box span {
            color: var(--gold-accent);
            font-weight: bold;
        }

        /* 모바일 대응 (화면이 좁아지면 세로 1열로 스택) */
        @media (max-width: 768px) {
            .container.wide-result {
                max-width: 440px;
            }
            .result-split-wrapper {
                flex-direction: column;
            }
        }

        .main-btn {
            background: linear-gradient(135deg, #2c224d, #131b2e);
            color: var(--gold-accent);
            border: 1.5px solid var(--gold-accent);
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .main-btn:hover {
            background: var(--gold-accent);
            color: var(--bg-deep);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="floating-cards">
        <div class="tarot-deco" style="--rot: -15deg;"></div>
        <div class="tarot-deco" style="--rot: 20deg;"></div>
        <div class="tarot-deco" style="--rot: 10deg;"></div>
        <div class="tarot-deco" style="--rot: -25deg;"></div>
    </div>

    <div class="container" id="main-container">
        <!-- 1. 입력 화면 -->
        <div id="input-screen">
            <h1>🔮 타로와 별의 기록 🌟</h1>
            <p>밤하늘의 별자리와 타로의 아르카나가 가리키는 오늘의 기운을 읽어내어, 당신과 운명적으로 얽힌 여성향 소설 속 세계를 비춰드립니다.</p>
            
            <div class="form-group">
                <label>생년월일</label>
                <input type="text" id="birth-date" class="form-control" maxlength="10">
            </div>

            <div class="form-group">
                <label>성별</label>
                <div class="gender-group">
                    <button type="button" class="gender-btn active" onclick="selectGender('여성', this)">여성</button>
                    <button type="button" class="gender-btn" onclick="selectGender('남성', this)">남성</button>
                    <button type="button" class="gender-btn" onclick="selectGender('기타/비공개', this)">기타</button>
                </div>
            </div>

            <button class="main-btn" onclick="startReading()">운명의 별자리 점치기</button>
        </div>

        <!-- 2. 수정구슬 로딩 연출 화면 -->
        <div id="loading-screen" class="hide">
            <div class="crystal-ball"></div>
            <p class="loading-text">✦ 수정구슬 안에서 별의 궤적이 움직이는 중... ✦</p>
        </div>

        <!-- 3. 결과 화면 (2분할 레이아웃) -->
        <div id="result-screen" class="hide">
            <div class="result-split-wrapper">
                
                <!-- 왼쪽 컬럼: 소설 추천 및 추천 이유 -->
                <div class="result-col">
                    <div>
                        <h3>📜 운명적으로 연결된 소설 세계</h3>
                        <h2 id="result-title">작품 제목</h2>
                        <div class="result-badge" id="result-badge">장르 및 키워드</div>
                        <div class="result-desc-text" id="result-desc">작품 설명</div>
                    </div>
                    <div class="why-recommended-box">
                        <p>💡 <span>추천 운명적 해설:</span> <span id="why-recommended-text" style="color:#e2e8f0; font-weight:normal;"></span></p>
                    </div>
                </div>

                <!-- 오른쪽 컬럼: 오늘의 운세, 행운 아이템, 조심할 점 -->
                <div class="result-col">
                    <div>
                        <h3>✦ 오늘의 별자리 및 타로 총평 ✦</h3>
                        <div id="astro-meta-title" style="font-size: 12px; color: var(--gold-accent); margin-bottom: 8px; font-weight: bold;"></div>
                        <div class="astrology-summary-text" id="astrology-summary"></div>
                    </div>
                    <div class="astro-items-box">
                        <p>✨ <span>행운 아이템:</span> <span id="lucky-item-text" style="color:#e2e8f0; font-weight:normal;"></span></p>
                        <p>⚠️ <span>조심할 일:</span> <span id="caution-text" style="color:#e2e8f0; font-weight:normal;"></span></p>
                    </div>
                </div>

            </div>
            
            <button class="main-btn" onclick="resetForm()">다시 점치기</button>
        </div>
    </div>

    <script>
        let selectedGender = "여성";
        const birthInput = document.getElementById("birth-date");
        const mainContainer = document.getElementById("main-container");

        birthInput.addEventListener("input", (e) => {
            let value = e.target.value.replace(/[^0-9]/g, "");
            if (value.length > 8) value = value.slice(0, 8);

            let formatted = "";
            if (value.length <= 4) {
                formatted = value;
            } else if (value.length <= 6) {
                formatted = value.slice(0, 4) + "-" + value.slice(4);
            } else {
                formatted = value.slice(0, 4) + "-" + value.slice(4, 6) + "-" + value.slice(6, 8);
            }
            e.target.value = formatted;
        });

        function selectGender(gender, element) {
            selectedGender = gender;
            const buttons = document.querySelectorAll('.gender-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

        function startReading() {
            const birthDate = birthInput.value;
            if (!birthDate || birthDate.length < 10) {
                alert("생년월일을 정확히 입력해 주세요!");
                return;
            }

            document.getElementById("input-screen").classList.add("hide");
            document.getElementById("loading-screen").classList.remove("hide");

            setTimeout(() => {
                let hash = 0;
                for (let i = 0; i < birthDate.length; i++) {
                    hash += birthDate.charCodeAt(i);
                }
                if (selectedGender === '남성') hash += 11;
                else if (selectedGender === '기타/비공개') hash += 23;

                const selectedIndex = hash % novelResults.length;
                const chosen = novelResults[selectedIndex];

                // 데이터 바인딩 (왼쪽: 소설 및 추천 이유 / 오른쪽: 운세 및 아이템)
                document.getElementById("result-title").innerText = chosen.title;
                document.getElementById("result-badge").innerText = chosen.badge;
                document.getElementById("result-desc").innerText = chosen.desc;
                document.getElementById("why-recommended-text").innerText = chosen.whyRecommended;

                document.getElementById("astro-meta-title").innerText = `✦ 별의 전언 (${selectedGender} / ${birthDate}) ✦`;
                document.getElementById("astrology-summary").innerText = chosen.astroText;
                document.getElementById("lucky-item-text").innerText = chosen.luckyItem;
                document.getElementById("caution-text").innerText = chosen.caution;

                // 컨테이너 폭 넓히기 (2분할 적용)
                mainContainer.classList.add("wide-result");

                document.getElementById("loading-screen").classList.add("hide");
                document.getElementById("result-screen").classList.remove("hide");
            }, 1800);
        }

        function resetForm() {
            document.getElementById("result-screen").classList.add("hide");
            mainContainer.classList.remove("wide-result");
            document.getElementById("input-screen").classList.remove("hide");
            birthInput.value = "";
        }
    </script>
</body>
</html>
